# =========================================================================
#  pedidos-restaurante - Configuracion principal
#  Los valores sensibles NO viven aqui. Ver config/security.properties
# =========================================================================

# --- Servidor -----------------------------------------------------------
# Se puede cambiar el puerto con la variable de entorno SERVER_PORT
# o con --server.port=9090 al ejecutar.
server.port=${SERVER_PORT:8080}
# Escucha en todas las interfaces para permitir acceso desde la red local (Wi-Fi).
server.address=0.0.0.0
server.error.include-message=always
server.error.include-stacktrace=never

# --- Sesion (cookie HttpOnly + SameSite) --------------------------------
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=8h

# --- Base de datos H2 (modo archivo, persistente) -----------------------
# El archivo resultante es  ./data/pedidos.mv.db  relativo al directorio de trabajo.
# Nota: H2 2.x no permite combinar AUTO_SERVER=TRUE con DB_CLOSE_ON_EXIT=FALSE.
# Como la consola H2 esta desactivada y el acceso es solo desde esta aplicacion,
# no se necesita AUTO_SERVER.
# LOCK_TIMEOUT (ms): tiempo que una transaccion espera por un lock de fila (por ejemplo,
# la secuencia de pedidos) antes de rendirse. Un valor corto produce errores bajo
# concurrencia; 10 s es seguro para varias cajas/dispositivos creando pedidos a la vez.
spring.datasource.url=jdbc:h2:file:./data/pedidos;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Consola H2 DESACTIVADA: no se expone a la red.
spring.h2.console.enabled=false

# --- JPA / Hibernate ----------------------------------------------------
# 'update' es NO destructivo: agrega columnas/tablas nuevas y conserva los datos.
# Nunca se usa 'create' ni 'create-drop' en runtime para no borrar informacion.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false

# --- Thymeleaf ----------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# --- Carga inicial idempotente del catalogo -----------------------------
pedidos.seed.enabled=true

# --- Negocio (configurable en runtime desde Administracion) -------------
pedidos.business.name=Pizzería Demo
pedidos.business.currency-symbol=$
pedidos.business.default-delivery-fee=5000

# --- Impresion ----------------------------------------------------------
# mode = SIMULATION  -> escribe la comanda en data/print-simulation/ (NO imprime fisicamente)
# mode = REAL        -> envia a la impresora del servidor por javax.print
pedidos.print.mode=${PEDIDOS_PRINT_MODE:SIMULATION}
pedidos.print.printer-name=${PEDIDOS_PRINTER_NAME:}
pedidos.print.paper-width=${PEDIDOS_PAPER_WIDTH:42}
pedidos.print.dedupe-window-seconds=20
# Carpeta de comandas en modo simulacion (se crea automaticamente).
pedidos.print.simulation-dir=data/print-simulation

# --- Modulo de bloqueo temporal (hombre muerto) -------------------------
pedidos.security.interval-months=2
pedidos.security.module-enabled=true
# Archivo local (excluido de git) que puede contener la credencial inicial.
pedidos.security.file=./config/security.properties
# Variables de entorno que tambien pueden aportar la credencial inicial.
#   PEDIDOS_ADMIN_PASSWORD
#   PEDIDOS_ADMIN_EMAIL

# --- Backups ------------------------------------------------------------
pedidos.backup.dir=./data/backups

# --- Archivos / subidas -------------------------------------------------
spring.servlet.multipart.enabled=false

# --- Logging (no exponer secretos) --------------------------------------
logging.level.root=INFO
logging.level.com.restaurante.pedidos=INFO
logging.level.org.hibernate.SQL=WARN
