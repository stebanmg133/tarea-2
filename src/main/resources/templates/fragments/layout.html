<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <meta name="theme-color" content="#b91c1c"/>
    <title th:text="${title}">pedidos-restaurante</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>

<header th:fragment="nav" class="topbar">
    <a class="brand" th:href="@{/}">
        <span class="brand-ico">&#127829;</span>
        <span class="brand-txt">Pedidos Restaurante</span>
    </a>
    <nav class="nav">
        <a th:href="@{/}">Panel</a>
        <a th:href="@{/mesas}">Mesas</a>
        <a th:href="@{/areas}">Áreas</a>
        <a th:href="@{/pedidos}">Pedidos</a>
        <a th:href="@{/impresion}">Impresión</a>
        <a th:href="@{/catalogo}">Catálogo</a>
        <a th:href="@{/sistema}">Sistema</a>
        <a th:href="@{/admin}">Admin</a>
    </nav>
    <div class="topbar-right">
        <span id="printModeBadge" class="badge hidden" title="Modo de impresión"></span>
        <span id="lockBadge" class="badge badge-lock hidden">Bloqueado</span>
        <span id="serverTime" class="muted small"></span>
    </div>
</header>

<div th:fragment="lockOverlay">
    <div id="lockOverlay" class="lock-overlay hidden">
        <div class="lock-card">
            <div class="lock-ico">&#128274;</div>
            <h2>Página bloqueada, ingrese contraseña</h2>
            <p class="muted">El período de validación venció. Ingrese la contraseña para continuar.</p>
            <input type="password" id="lockPassword" placeholder="Contraseña" autocomplete="current-password"/>
            <div class="row">
                <button class="btn primary" id="lockBtn">Desbloquear</button>
            </div>
            <p id="lockError" class="error hidden"></p>
        </div>
    </div>
</div>

<footer th:fragment="footer" class="footer">
    <span class="muted small">pedidos-restaurante · uso interno en red local</span>
</footer>

<div th:fragment="scripts">
    <script th:src="@{/js/app.js}"></script>
</div>

</body>
</html>
