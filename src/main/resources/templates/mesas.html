<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${title})}"></head>
<body data-page="mesas">
<header th:replace="~{fragments/layout :: nav}"></header>

<main class="container">
    <h1 class="page-title">Nuevo pedido</h1>

    <div class="card">
        <h2 class="section-title" style="margin-top:0">1. Tipo de pedido</h2>
        <div id="typeChoices" class="type-choices">
            <button class="type-btn selected" data-type="MESA"><span class="ico">🍽️</span>Mesa</button>
            <button class="type-btn" data-type="DOMICILIO"><span class="ico">🛵</span>Domicilio</button>
            <button class="type-btn" data-type="LLEVAR"><span class="ico">🛍️</span>Para llevar</button>
        </div>
        <p class="muted small">Mesa: se ocupa automáticamente y se libera al entregar todo.
            Domicilio: incluye nombre, teléfono y dirección; el domicilio se suma al total.
            Para llevar: sin mesa ni dirección.</p>
    </div>

    <div id="tableSection" class="card" style="margin-top:1rem">
        <h2 class="section-title" style="margin-top:0">2. Elija la mesa (M01 a M15)</h2>
        <div id="tablesGrid" class="tables-grid"></div>
    </div>

    <div id="deliveryQuick" class="card hidden" style="margin-top:1rem">
        <h2 class="section-title" style="margin-top:0">2. Continuar</h2>
        <p class="muted">Domicilio o para llevar no usan mesa.</p>
        <button class="btn primary" id="goDelivery">Continuar con este tipo →</button>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: lockOverlay}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
