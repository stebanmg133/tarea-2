# =========================================================================
#  Configuracion para PRUEBAS AUTOMATICAS
#  Usa una base de datos H2 de archivo aislada bajo target/ para no tocar
#  los datos reales de ./data. Se recrea en cada ejecucion de pruebas.
# =========================================================================

spring.datasource.url=jdbc:h2:file:./target/test-db/pedidos;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# Carga inicial del catalogo de demostracion.
pedidos.seed.enabled=true

# Impresion en modo simulacion, en una carpeta aislada.
pedidos.print.mode=SIMULATION
pedidos.print.printer-name=
pedidos.print.paper-width=42
pedidos.print.dedupe-window-seconds=20
pedidos.print.simulation-dir=./target/test-print

# Credencial inicial conocida para las pruebas de bloqueo.
pedidos.security.file=./src/test/resources/test-security.properties
pedidos.security.interval-months=2
pedidos.security.module-enabled=true

# Backups en una carpeta aislada.
pedidos.backup.dir=./target/test-backups

logging.level.root=WARN
logging.level.com.restaurante.pedidos=INFO
